name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up node
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
         npm ci
         npx playwright install --with-deps   

      - name: Run tests
        run: chmod +x node_modules/.bin/playwright && npx playwright test --reporter=junit --output=test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Report
          path: test-results.xml
          reporter: jest-junit  

